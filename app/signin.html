<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Sign in to Zetapro</title>
  <link rel="icon" href="icons/icon-192.png">
  <!-- The Windows app opens this page in the browser as signin.html?port=…&state=…
       (src/desktop-signin.js). It signs in with Google here, then sends the
       Google ID token back to the app on this computer by navigating to
       http://127.0.0.1:<port>/done. Nothing is kept in this browser. -->
  <style>
    :root {
      color-scheme: light dark;
      --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f2f1ed; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
      --border: rgba(11, 11, 11, 0.10); --border-strong: rgba(11, 11, 11, 0.18); --bad: #d03b3b;
      --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 4px 16px rgba(11, 11, 11, 0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
        --border: rgba(255, 255, 255, 0.10); --border-strong: rgba(255, 255, 255, 0.18); --bad: #e66767; --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--page); color: var(--ink);
      font: 15px/1.5 system-ui, "Segoe UI Variable Text", "Segoe UI", -apple-system, sans-serif;
    }
    main {
      width: 100%; max-width: 380px; padding: 32px 28px 26px; text-align: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
    }
    img.logo { display: block; margin: 0 auto 14px; border-radius: 10px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
    p { margin: 0; color: var(--ink-2); }
    button {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; height: 46px; margin-top: 22px; padding: 0 16px; cursor: pointer;
      font: inherit; font-size: 15px; font-weight: 500; color: var(--ink);
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
    }
    button:hover { background: var(--surface-2); }
    button:disabled { opacity: 0.45; cursor: default; background: var(--surface); }
    #msg { min-height: 1.5em; margin-top: 14px; font-size: 13.5px; }
    #msg.bad { color: var(--bad); }
    .fine { margin-top: 18px; font-size: 12.5px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="icons/icon-192.png" alt="" width="48" height="48">
    <h1>Sign in to Zetapro</h1>
    <p>Choose your Google account to sign in the Zetapro app on this computer.</p>
    <button id="go" disabled>
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span>Continue with Google</span>
    </button>
    <p id="msg" role="status"></p>
    <p class="fine">The sign-in goes only to the Zetapro app on this computer.</p>
  </main>

  <script src="firebase-config.js"></script>
  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-auth-compat.js"></script>
  <script>
  (function () {
    'use strict';
    var q = new URLSearchParams(location.search);
    var port = Number(q.get('port'));
    var state = q.get('state') || '';
    var btn = document.getElementById('go');
    var msg = document.getElementById('msg');
    var say = function (text, bad) { msg.textContent = text; msg.className = bad ? 'bad' : ''; };

    if (!(Number.isInteger(port) && port > 0 && port < 65536) || !/^[0-9a-f]{32,128}$/i.test(state)) {
      say('Open this page from the Zetapro app: Sign in, then Continue with Google.', true);
      return;
    }

    var auth;
    try {
      // Its own app name, so the website's signed-in session in this browser is
      // never touched, and no persistence, so nothing is left behind here.
      auth = firebase.initializeApp(window.ZETAPRO_FIREBASE, 'desktop-signin').auth();
    } catch (e) {
      say('Couldn’t load the sign-in service. Reload the page to try again.', true);
      return;
    }
    var provider = function () {
      var p = new firebase.auth.GoogleAuthProvider();
      p.setCustomParameters({ prompt: 'select_account' });
      return p;
    };

    var failed = function (e) {
      var code = e && e.code;
      btn.disabled = false;
      say(code === 'auth/popup-closed-by-user' || code === 'auth/canceled-popup-request'
        ? 'The Google window was closed. Press the button to try again.'
        : code === 'auth/network-request-failed'
          ? 'Couldn’t reach Google. Check your connection and try again.'
          : (e && e.message) || 'Something went wrong. Try again.', true);
    };

    // Back to the app: a top-level navigation to the app's one-shot server.
    var finish = function (result) {
      var token = result && result.credential && result.credential.idToken;
      if (!token) return failed({ message: 'Google didn’t return a sign-in. Try again.' });
      btn.disabled = true;
      say('Signed in. Returning to Zetapro…');
      location.href = 'http://127.0.0.1:' + port + '/done?state=' + encodeURIComponent(state) + '&id_token=' + encodeURIComponent(token);
    };

    btn.addEventListener('click', function () {
      btn.disabled = true;
      say('Opening Google…');
      // Straight from the click, or the browser blocks the window.
      auth.signInWithPopup(provider()).then(finish, function (e) {
        if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) {
          say('Taking you to Google…');
          return auth.signInWithRedirect(provider()).catch(failed);
        }
        failed(e);
      });
    });

    // Coming back from the redirect fallback finishes here; otherwise the
    // button is ready.
    auth.setPersistence(firebase.auth.Auth.Persistence.NONE)
      .then(function () { return auth.getRedirectResult(); })
      .then(function (result) {
        if (result && result.credential) finish(result);
        else btn.disabled = false;
      })
      .catch(failed);
  })();
  </script>
</body>
</html>
